name: TEAM CCTV Certification Regression & Release Safety Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Security: Set permissions to least privilege
permissions:
  contents: read

jobs:
  # =========================================================================
  # GATE 1: Certification Regression & Integrity Verification
  # =========================================================================
  certification-regression:
    name: Certification Regression & Integrity Guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Invariant 5.2.3 & 5.2.4: Tamper check MUST run before regression.
      # Baseline manifest regeneration (cert:manifest) is STRICTLY PROHIBITED in CI.
      - name: Verify Certification Manifest (Tamper Guard)
        run: npm run cert:manifest:verify

      # Invariant 5.2.1: Enforce all 7 quality gates
      - name: Run Certification Regression (7 Quality Gates)
        run: npm run cert:regression

      # Invariant 6.1, 6.2, 6.3: Enforce all certified test suites
      - name: Run Certified Test Suites (Governance, Safety, Telemetry, Release)
        run: npm run cert:suites

      # Invariant 5.2.6: Retain machine-readable audit trail
      - name: Retain Certification Audit Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-evidence-${{ github.sha }}
          path: |
            tests/certification/manifest/TEAM-CCTV-CERT-V1.json
            tests/certification/regression/last-regression-result.json
            tests/certification/regression/.tmp/
          retention-days: 90
          if-no-files-found: warn

  # =========================================================================
  # GATE 2: Production Build Gate (Certification Pre-Requisite Enforced)
  # Invariant 6.3.4: Build CANNOT execute if certification fails.
  # =========================================================================
  production-build:
    name: Production Build & Typecheck Gate
    needs: certification-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict Certification Typecheck
        run: npm run cert:typecheck

      - name: Production TypeScript Check
        run: npx tsc --noEmit

  # =========================================================================
  # GATE 3: Release Provenance & Decoupling Gate
  # Invariant 6.3.2 & 6.3.3: Deployment Version != Certification Baseline
  # Invariant 6.3.12: Strict Zero Secrets Validation
  # =========================================================================
  release-deployment-gate:
    name: Release Provenance & Deployment Gate
    needs: production-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Release Identity & Provenance
        run: npm run cert:release:verify
        env:
          GITHUB_SHA: ${{ github.sha }}
          NODE_ENV: production
